<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102d3b">
  <title>hamon</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: #102d3b; color: #d2e6eb; font-family: system-ui, sans-serif; }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      background: radial-gradient(ellipse at 50% 35%, #204957, #102d3b 75%);
    }
    header { position: absolute; top: 24px; left: 24px; pointer-events: none; }
    h1 { margin: 0; font-size: 24px; font-weight: 400; letter-spacing: .16em; }
    p { margin: 8px 0 0; font-size: 13px; color: #a3bec7; }
  </style>
</head>
<body>
  <canvas id="water" aria-label="クリックまたはタップすると波紋が広がる水面"></canvas>
  <header>
    <h1>hamon</h1>
    <p>水面をクリック / タップ</p>
  </header>
  <script>
    'use strict';

    const canvas = document.getElementById('water');
    const context = canvas.getContext('2d');
    const ripples = [];
    const duration = 2600;
    const speed = 110; // CSS pixels per second
    let width = 0;
    let height = 0;
    let frameId = null;

    function resize() {
      const bounds = canvas.getBoundingClientRect();
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      width = bounds.width;
      height = bounds.height;
      canvas.width = Math.round(width * ratio);
      canvas.height = Math.round(height * ratio);
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    function draw(now) {
      context.clearRect(0, 0, width, height);

      for (let i = ripples.length - 1; i >= 0; i--) {
        const ripple = ripples[i];
        const age = now - ripple.started;
        if (age >= duration) {
          ripples.splice(i, 1);
          continue;
        }

        const fade = Math.pow(1 - age / duration, 1.5);
        // Each touch produces three concentric rings, slightly delayed.
        for (let ring = 0; ring < 3; ring++) {
          const ringAge = age - ring * 160;
          if (ringAge < 0) continue;
          const radius = 2 + ringAge / 1000 * speed;
          context.beginPath();
          context.arc(ripple.x, ripple.y, radius, 0, Math.PI * 2);
          context.strokeStyle = `rgba(190, 233, 241, ${fade * (0.65 - ring * 0.14)})`;
          context.lineWidth = 1.5;
          context.stroke();
        }
      }

      // Stop requesting frames when the water is still.
      frameId = ripples.length ? requestAnimationFrame(draw) : null;
    }

    canvas.addEventListener('pointerdown', (event) => {
      if (event.pointerType === 'mouse' && event.button !== 0) return;
      const bounds = canvas.getBoundingClientRect();
      ripples.push({
        x: event.clientX - bounds.left,
        y: event.clientY - bounds.top,
        started: performance.now(),
      });
      if (frameId === null) frameId = requestAnimationFrame(draw);
    });

    window.addEventListener('resize', resize);
    resize();
  </script>
</body>
</html>

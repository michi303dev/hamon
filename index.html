<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10283f">
  <title>hamon</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: #10283f; color: #d2e6eb; font-family: system-ui, sans-serif; }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      background: radial-gradient(ellipse at 50% 35%, #20435e, #10283f 75%);
    }
    header { position: absolute; top: 24px; left: 24px; pointer-events: none; }
    h1 { margin: 0; font-size: 24px; font-weight: 400; letter-spacing: .16em; }
    p { margin: 8px 0 0; font-size: 13px; color: #a3bec7; }
    .rain-control {
      position: absolute;
      top: 50%;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: max(8px, env(safe-area-inset-left));
      width: 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: #c5dce3;
      font-size: 12px;
      user-select: none;
    }
    .rain-control span { pointer-events: none; }
    #rain {
      writing-mode: vertical-lr;
      direction: ltr;
      appearance: none;
      -webkit-appearance: none;
      flex: 1;
      min-height: 0;
      width: 48px;
      margin: 0;
      background: transparent;
      cursor: pointer;
      touch-action: none;
    }
    #rain::-webkit-slider-runnable-track {
      width: 4px;
      background: #70939f;
      border-radius: 4px;
    }
    #rain::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 28px;
      height: 28px;
      margin-left: -12px;
      border: 2px solid #d2e6eb;
      border-radius: 50%;
      background: #20435e;
    }
    #rain::-moz-range-track { width: 4px; background: #70939f; border-radius: 4px; }
    #rain::-moz-range-thumb {
      width: 24px;
      height: 24px;
      border: 2px solid #d2e6eb;
      border-radius: 50%;
      background: #20435e;
    }
    #rain:focus-visible { outline: 2px solid #d2e6eb; outline-offset: 2px; border-radius: 16px; }
  </style>
</head>
<body>
  <canvas id="water" aria-label="クリックまたはタップすると波紋が広がる水面"></canvas>
  <header>
    <h1>hamon</h1>
    <p>水面をクリック / タップ</p>
  </header>
  <div class="rain-control">
    <span aria-hidden="true">yamu</span>
    <input id="rain" type="range" min="0" max="60" step="1" value="0"
      aria-label="雨の強さ" aria-orientation="vertical" aria-valuetext="秒間0タップ">
    <span aria-hidden="true">furu</span>
  </div>
  <script>
    'use strict';

    const canvas = document.getElementById('water');
    const context = canvas.getContext('2d');
    const rain = document.getElementById('rain');
    const ripples = [];
    const speed = 110; // CSS pixels per second
    const initialRadius = 2;
    const maxRadius = initialRadius + speed * 2.6;
    const ringDelay = 160;
    const rippleLifetime = (maxRadius - initialRadius) / speed * 1000 + ringDelay * 2;
    let width = 0;
    let height = 0;
    let frameId = null;
    const rainResponse = 1; // About three seconds to reach 95% of the target.
    let targetRainRate = 0;
    let rainRate = 0;
    let rainRemainder = 0;
    let nextRainDrop = 0.7 + Math.random() * 0.6;
    let lastRainTime = null;
    let audioContext;
    const dropSound = {
      duration: 0.075,
      attack: 0.0035,
      sweep: 0.0225,
      volume: 0.09,
      pitchVariation: 0.08,
      tones: [
        { from: 3920, to: 2080, level: 0.82 },
        { from: 6920, to: 3480, level: 0.18 },
      ],
    };
    // Always start dry, including browsers that restore form values on reload.
    rain.value = '0';

    function startAnimation() {
      if (frameId === null) frameId = requestAnimationFrame(draw);
    }

    function addRipple(x, y, started) {
      ripples.push({ x, y, started });
    }

    async function unlockAudio() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      if (!audioContext) {
        // Use media playback on Safari so the silent switch does not mute Web Audio.
        try {
          if (navigator.audioSession) navigator.audioSession.type = 'playback';
        } catch {
          // AudioSession is optional. Web Audio can still be initialized.
        }
        audioContext = new AudioContext();
      }
      if (audioContext.state !== 'running') {
        // Start a silent source during the gesture, including slider gestures.
        const primer = audioContext.createBufferSource();
        primer.buffer = audioContext.createBuffer(1, 1, audioContext.sampleRate);
        primer.connect(audioContext.destination);
        primer.onended = () => primer.disconnect();
        primer.start();
        await audioContext.resume();
      }
    }

    function playDropSound(fromGesture = false) {
      if (!audioContext || (!fromGesture && audioContext.state !== 'running')) return;
      const start = audioContext.currentTime;
      const end = start + dropSound.duration;
      const pitch = 1 + (Math.random() * 2 - 1) * dropSound.pitchVariation;
      const envelope = audioContext.createGain();
      envelope.gain.setValueAtTime(0, start);
      envelope.gain.linearRampToValueAtTime(dropSound.volume, start + dropSound.attack);
      envelope.gain.exponentialRampToValueAtTime(0.0001, end);
      envelope.connect(audioContext.destination);

      for (const tone of dropSound.tones) {
        const oscillator = audioContext.createOscillator();
        const mix = audioContext.createGain();
        mix.gain.value = tone.level;
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(tone.from * pitch, start);
        oscillator.frequency.exponentialRampToValueAtTime(tone.to * pitch, start + dropSound.sweep);
        oscillator.connect(mix);
        mix.connect(envelope);
        oscillator.onended = () => {
          oscillator.disconnect();
          mix.disconnect();
          // Both tones have the same stop time.
          envelope.disconnect();
        };
        oscillator.start(start);
        oscillator.stop(end);
      }
    }

    function resize() {
      const bounds = canvas.getBoundingClientRect();
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      width = bounds.width;
      height = bounds.height;
      canvas.width = Math.round(width * ratio);
      canvas.height = Math.round(height * ratio);
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    function draw(now) {
      if (lastRainTime !== null) {
        // Smooth the actual rain rate independently of the screen refresh rate.
        // Cap elapsed time to avoid bursts after a suspended browser tab.
        const elapsed = Math.min(Math.max(0, now - lastRainTime), 100) / 1000;
        const decay = Math.exp(-elapsed / rainResponse);
        const difference = rainRate - targetRainRate;
        rainRemainder += targetRainRate * elapsed
          + difference * rainResponse * (1 - decay);
        rainRate = targetRainRate + difference * decay;
        if (Math.abs(rainRate - targetRainRate) < 0.01) rainRate = targetRainRate;
        while (rainRemainder >= nextRainDrop - 1e-9) {
          rainRemainder = Math.max(0, rainRemainder - nextRainDrop);
          // Preserve sub-frame spacing, including multiple drops in one frame.
          const started = now - (rainRate > 0 ? rainRemainder / rainRate * 1000 : 0);
          addRipple(Math.random() * width, Math.random() * height, started);
          playDropSound();
          // At a steady rate, each interval is 70–130% of the nominal interval.
          nextRainDrop = 0.7 + Math.random() * 0.6;
        }
      }
      lastRainTime = now;
      context.clearRect(0, 0, width, height);

      for (let i = ripples.length - 1; i >= 0; i--) {
        const ripple = ripples[i];
        const age = now - ripple.started;
        if (age >= rippleLifetime) {
          ripples.splice(i, 1);
          continue;
        }

        // Each touch produces three concentric rings, slightly delayed.
        for (let ring = 0; ring < 3; ring++) {
          const ringAge = age - ring * ringDelay;
          if (ringAge < 0) continue;
          const radius = initialRadius + ringAge / 1000 * speed;
          if (radius >= maxRadius) continue;
          // All rings fade by distance and disappear at the same radius.
          const progress = (radius - initialRadius) / (maxRadius - initialRadius);
          const fade = Math.pow(1 - progress, 1.5);
          // Ring 0 starts first and is outermost; ring 2 is innermost.
          const lineWidth = 1.5 * [2, 1.5, 1.2][ring];
          const alpha = fade * (0.65 - ring * 0.14);
          // Shade across the stroke's width, rather than around the circle.
          const gradient = context.createRadialGradient(
            ripple.x, ripple.y, radius - lineWidth / 2,
            ripple.x, ripple.y, radius + lineWidth / 2,
          );
          gradient.addColorStop(0, `rgba(12, 31, 49, ${alpha})`);
          gradient.addColorStop(0.5, `rgba(210, 242, 250, ${alpha})`);
          gradient.addColorStop(1, `rgba(12, 31, 49, ${alpha})`);
          context.beginPath();
          context.arc(ripple.x, ripple.y, radius, 0, Math.PI * 2);
          context.strokeStyle = gradient;
          context.lineWidth = lineWidth;
          context.stroke();
        }
      }

      // Stop requesting frames when the water is still.
      frameId = ripples.length || rainRate > 0 || targetRainRate > 0 ? requestAnimationFrame(draw) : null;
    }

    function unlockRainAudio(event) {
      if (event.isTrusted && targetRainRate > 0) unlockAudio().catch(() => {});
    }

    function unlockOnMouseDown(event) {
      if (event.isTrusted && event.pointerType === 'mouse' && event.button === 0) {
        unlockAudio().catch(() => {});
      }
    }

    // Touch activation may only become available when the finger lifts.
    rain.addEventListener('pointerdown', unlockOnMouseDown);
    rain.addEventListener('pointerup', unlockRainAudio);
    rain.addEventListener('touchend', unlockRainAudio, { passive: true });
    rain.addEventListener('click', unlockRainAudio);
    rain.addEventListener('input', (event) => {
      // A gentle curve gives finer control near yamu and more change near furu.
      const position = Number(rain.value) / Number(rain.max);
      targetRainRate = 60 * Math.pow(position, 1.5);
      unlockRainAudio(event);
      if (frameId === null) {
        rainRemainder = 0;
        lastRainTime = performance.now();
      }
      rain.setAttribute('aria-valuetext', `秒間${Number(targetRainRate.toFixed(1))}タップ`);
      startAnimation();
    });

    document.addEventListener('visibilitychange', () => {
      lastRainTime = null;
      rainRemainder = 0;
    });

    canvas.addEventListener('pointerdown', (event) => {
      if (event.pointerType === 'mouse' && event.button !== 0) return;
      unlockOnMouseDown(event);
      const bounds = canvas.getBoundingClientRect();
      addRipple(event.clientX - bounds.left, event.clientY - bounds.top, performance.now());
      startAnimation();
    });

    function playFromGesture() {
      unlockAudio().catch(() => {});
      playDropSound(true);
    }

    // Schedule directly on touchend. Cancel the follow-up mouse click so
    // the same tap cannot schedule a second sound.
    canvas.addEventListener('touchend', (event) => {
      if (!event.isTrusted) return;
      event.preventDefault();
      playFromGesture();
    }, { passive: false });

    canvas.addEventListener('click', (event) => {
      if (!event.isTrusted) return;
      unlockAudio().then(() => playDropSound()).catch(() => {});
    });

    window.addEventListener('resize', resize);
    resize();
  </script>
</body>
</html>
